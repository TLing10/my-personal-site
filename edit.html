<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>✨ 在线编辑后台 · Elaine</title>
<link rel="icon" href="images/logo.jpg">
<style>
  :root{
    --pink:#ffd3e0; --pink-soft:#fff0f5; --cream:#fff7f0;
    --blue:#cdeafe; --mint:#c8f0e0; --lav:#e3d4ff;
    --text:#5b4a42; --text-soft:#8a776c; --brown:#8b6f5c;
    --line:#f0ddd6; --shadow:0 8px 24px rgba(139,111,92,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text); background:
      radial-gradient(circle at 12% 10%, rgba(227,212,255,.5), transparent 40%),
      radial-gradient(circle at 88% 8%, rgba(205,234,254,.5), transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(255,211,224,.45), transparent 55%),
      linear-gradient(160deg,#fff7f0,#fdf2f7 55%,#f3f0ff);
    min-height:100vh;
  }
  /* ---------- 密码门 ---------- */
  #gate{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#fff7f0,#f3f0ff); z-index:50; padding:20px;
  }
  .gate-box{
    width:100%; max-width:360px; background:rgba(255,255,255,.82); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:26px; padding:34px 26px; text-align:center; box-shadow:var(--shadow);
  }
  .gate-logo{font-size:42px;}
  .gate-box h1{margin:.3em 0 .1em; font-size:1.5rem;}
  .gate-box p{color:var(--text-soft); font-size:.9rem; margin:.2em 0 1.2em;}
  #pass{
    width:100%; padding:14px 16px; border:1.5px solid var(--line); border-radius:16px; font-size:1rem;
    background:#fff; outline:none; margin-bottom:14px;
  }
  #pass:focus{border-color:var(--pink);}
  .gate-hint{font-size:.78rem; color:#b3a59c; margin-top:14px;}
  /* ---------- 顶栏 ---------- */
  #app{display:none;}
  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:14px 16px; background:rgba(255,255,255,.78); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar .brand{font-weight:700; font-size:1.05rem; margin-right:auto; display:flex; align-items:center; gap:8px;}
  .topbar a.btn-ghost{
    text-decoration:none; color:var(--brown); font-size:.85rem; padding:8px 12px; border-radius:12px;
    background:var(--pink-soft); border:1px solid var(--line);
  }
  .btn{
    border:none; cursor:pointer; font-size:.9rem; font-weight:600; padding:10px 16px; border-radius:14px;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.55; cursor:not-allowed;}
  .btn-primary{background:linear-gradient(135deg,#ffb6c9,#c8a8ff); color:#fff;}
  .btn-soft{background:#fff; color:var(--brown); border:1px solid var(--line);}
  /* ---------- 令牌区 ---------- */
  .token-box{
    max-width:760px; margin:18px auto 0; padding:16px 18px; background:rgba(255,255,255,.7);
    border:1px solid var(--line); border-radius:18px;
  }
  .token-box h3{margin:0 0 6px; font-size:1rem;}
  .token-box .tip{font-size:.8rem; color:var(--text-soft); margin:0 0 12px; line-height:1.5;}
  .token-box .tip a{color:#7a5fd0;}
  .token-row{display:flex; gap:10px; flex-wrap:wrap;}
  #token{flex:1; min-width:220px; padding:12px 14px; border:1.5px solid var(--line); border-radius:14px; font-size:.95rem; outline:none;}
  #token:focus{border-color:var(--pink);}
  .remember{display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--text-soft); margin-top:10px;}
  /* ---------- 表单主体 ---------- */
  #editorBody{display:none; max-width:760px; margin:0 auto; padding:20px 16px 120px;}
  .edit-section{
    background:rgba(255,255,255,.74); border:1px solid var(--line); border-radius:20px;
    padding:18px 18px 22px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .sec-title{margin:0 0 14px; font-size:1.15rem; display:flex; align-items:center; gap:8px;}
  .f-field{margin-bottom:16px;}
  .f-label{display:block; font-size:.88rem; font-weight:600; margin-bottom:6px; color:var(--text);}
  .f-hint{font-weight:400; color:var(--text-soft); font-size:.78rem;}
  .f-input{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:14px;
    font-size:.95rem; font-family:inherit; background:#fff; outline:none; color:var(--text); resize:vertical;
  }
  .f-input:focus{border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,182,201,.25);}
  /* 列表条目 */
  .list-box{display:flex; flex-direction:column; gap:14px;}
  .item-card{
    border:1.5px dashed var(--lav); border-radius:16px; padding:14px; background:rgba(243,240,255,.4);
  }
  .item-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .item-title{font-weight:700; font-size:.95rem; color:#7a5fd0;}
  .item-ctrl{display:flex; gap:6px;}
  .mini{
    width:32px; height:32px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer;
    font-size:1rem; line-height:1; color:var(--brown);
  }
  .mini.del{color:#e06a8a;}
  .mini:active{transform:scale(.92);}
  .add-btn{
    margin-top:12px; width:100%; padding:12px; border:1.5px solid var(--pink); border-radius:14px;
    background:var(--pink-soft); color:#d35d86; font-weight:700; cursor:pointer; font-size:.95rem;
  }
  .add-btn:active{transform:scale(.98);}
  .empty-note{color:#b3a59c; font-size:.85rem; text-align:center; padding:10px;}
  /* 底部保存条 */
  .savebar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; gap:10px; padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border-top:1px solid var(--line);
  }
  .savebar .btn{flex:1;}
  /* Toast */
  .toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px);
    background:rgba(91,74,66,.94); color:#fff; padding:12px 20px; border-radius:30px; font-size:.9rem;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:60; max-width:88%; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- 密码门 -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">✦</div>
    <h1>编辑后台</h1>
    <p>这是 Elaine 的私人编辑页 🦦</p>
    <input id="pass" type="password" placeholder="请输入编辑密码" autocomplete="off">
    <button id="unlock" class="btn btn-primary" style="width:100%">进入 ✦</button>
    <div class="gate-hint">忘记密码？见 edit.js 顶部的 PASSCODE</div>
  </div>
</div>

<!-- 主应用 -->
<div id="app">
  <div class="topbar">
    <div class="brand">🦦 Elaine 的编辑台</div>
    <a class="btn-ghost" href="index.html" target="_blank">🔗 看网站</a>
    <button id="resetBtn" class="btn btn-soft">↺ 重置</button>
  </div>

  <div class="token-box">
    <h3>① 连接你的 GitHub 令牌</h3>
    <p class="tip">
      令牌只保存在你这台设备的浏览器里（localStorage），不会写进网站源码，也不会发给任何人，只用来向 GitHub 提交修改。<br>
      没有令牌？去 GitHub → <a href="https://github.com/settings/tokens" target="_blank">Settings › Tokens</a> 新建一个
      <b>classic token</b>（勾 repo 权限）或细粒度令牌（仅本仓库 Contents 写权限）即可。
    </p>
    <div class="token-row">
      <input id="token" type="password" placeholder="粘贴 GitHub 令牌（ghp_... 或 github_pat_...）" autocomplete="off">
      <button id="loadBtn" class="btn btn-primary">载入内容</button>
    </div>
    <label class="remember"><input id="remember" type="checkbox" checked> 记住此设备（下次自动填入令牌）</label>
  </div>

  <div id="editorBody">
    <form id="form" onsubmit="return false"></form>
  </div>

  <div class="savebar">
    <button id="saveBtn" class="btn btn-primary">💾 保存并发布</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="edit.js"></script>
</body>
</html>
